<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de dias</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<style>
:root{
  --bg:#f1f4f2; --surface:#e3e9e6; --text:#15231f; --muted:#5a6b65; --accent:#1f7a63; --accent-ink:#ffffff; --line:#c9d3ce; --warn:#a4452c;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1c26; --surface:#172a38; --text:#e7eef5; --muted:#92a7b5; --accent:#7fd1b9; --accent-ink:#0b1a22; --line:#27404f; --warn:#f0a08a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1c26; --surface:#172a38; --text:#e7eef5; --muted:#92a7b5; --accent:#7fd1b9; --accent-ink:#0b1a22; --line:#27404f; --warn:#f0a08a; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Fraunces",Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:32px 22px 40px;display:flex;flex-direction:column;gap:28px}
h1{font-size:1.05rem;font-weight:400;color:var(--muted);margin:0;text-align:center}
.days{text-align:center}
.days .n{font-size:clamp(6rem,34vw,9.5rem);line-height:.95;font-weight:600;letter-spacing:-.03em}
.days .l{font-size:1.1rem;color:var(--muted);margin-top:4px}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.clock div{background:var(--surface);border-radius:14px;padding:14px 6px;text-align:center}
.clock b{display:block;font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock span{font-size:.85rem;color:var(--muted)}
.since{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;text-align:center;font-size:.98rem;line-height:1.5}
.since small{display:block;color:var(--muted);font-size:.85rem}
.stats{display:flex;justify-content:space-around;text-align:center;font-size:.92rem;color:var(--muted)}
.stats b{display:block;color:var(--text);font-size:1.25rem;font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:15px 18px;font-size:1.05rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
.ghost{background:transparent;color:var(--warn);border:1px solid var(--line);width:100%}
.ghost.armed{background:var(--warn);color:var(--bg);border-color:var(--warn)}
label{display:block;font-size:.92rem;color:var(--muted);margin-bottom:6px}
input[type=datetime-local]{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.start{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.hidden{display:none !important}
.msg{text-align:center;color:var(--muted);font-size:.95rem;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Dias sem recaída</h1>

  <section id="idle" class="start">
    <p class="msg">Escolhe quando começaste. O contador guarda a data e a hora neste telemóvel.</p>
    <div>
      <label for="when">Início</label>
      <input type="datetime-local" id="when">
    </div>
    <button class="primary" id="go">Iniciar contador</button>
  </section>

  <section id="running" class="hidden" style="display:flex;flex-direction:column;gap:28px">
    <div class="days"><div class="n" id="d">0</div><div class="l" id="dl">dias</div></div>
    <div class="clock">
      <div><b id="h">00</b><span>horas</span></div>
      <div><b id="m">00</b><span>minutos</span></div>
      <div><b id="s">00</b><span>segundos</span></div>
    </div>
    <div class="since"><small>Começaste em</small><span id="since"></span></div>
    <div class="stats">
      <div><b id="best">0</b>melhor sequência (dias)</div>
      <div><b id="resets">0</b>recomeços</div>
    </div>
    <button class="ghost" id="reset">Recaí, recomeçar</button>
  </section>
</main>

<script>
var KEY = "contador_dias_v1";
var state = { start: null, best: 0, resets: 0 };
function load(){ try{ var r = localStorage.getItem(KEY); if(r){ var o = JSON.parse(r); if(o && typeof o === "object"){ state.start = o.start || null; state.best = o.best || 0; state.resets = o.resets || 0; } } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function $(id){ return document.getElementById(id); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function toLocalInput(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fmt(ts){
  return new Date(ts).toLocaleString("pt-PT", { weekday:"long", day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
function show(){
  var run = !!state.start;
  $("idle").classList.toggle("hidden", run);
  $("running").classList.toggle("hidden", !run);
  if(run){ $("since").textContent = fmt(state.start); $("best").textContent = state.best; $("resets").textContent = state.resets; tick(); }
  else { $("when").value = toLocalInput(Date.now()); }
}
function tick(){
  if(!state.start) return;
  var diff = Math.max(0, Date.now() - state.start);
  var days = Math.floor(diff / 86400000);
  var rest = diff % 86400000;
  $("d").textContent = days;
  $("dl").textContent = days === 1 ? "dia" : "dias";
  $("h").textContent = pad(Math.floor(rest / 3600000));
  $("m").textContent = pad(Math.floor((rest % 3600000) / 60000));
  $("s").textContent = pad(Math.floor((rest % 60000) / 1000));
  if(days > state.best){ state.best = days; $("best").textContent = days; save(); }
}
$("go").addEventListener("click", function(){
  var v = $("when").value;
  var ts = v ? new Date(v).getTime() : Date.now();
  if(isNaN(ts) || ts > Date.now()) ts = Date.now();
  state.start = ts; save(); show();
});
var armedTimer = null;
$("reset").addEventListener("click", function(){
  var b = $("reset");
  if(!b.classList.contains("armed")){
    b.classList.add("armed"); b.textContent = "Toca outra vez para confirmar";
    armedTimer = setTimeout(function(){ b.classList.remove("armed"); b.textContent = "Recaí, recomeçar"; }, 4000);
    return;
  }
  clearTimeout(armedTimer);
  var days = Math.floor((Date.now() - state.start) / 86400000);
  if(days > state.best) state.best = days;
  state.resets += 1; state.start = null; save();
  b.classList.remove("armed"); b.textContent = "Recaí, recomeçar";
  show();
});
load(); show();
setInterval(tick, 1000);
</script>
</body>
</html>
